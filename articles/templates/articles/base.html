<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Eco-Tomchi{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/static/css/ui.css" rel="stylesheet">    <script>
      // Apply saved theme before page paints to avoid flash
      (function(){
        try {
          const t = localStorage.getItem('site-theme');
          if (t === 'dark') document.documentElement.classList.add('theme-dark');
        } catch (e) { /* ignore */ }
      })();
    </script>    <style>
        /* Small enhancements for news-style cards */
        .news-card img { transition: transform .45s ease; }
        .news-card:hover img { transform: scale(1.05); }
        .prose img { border-radius: 0.75rem; }
        .article-blocks .md\\:w-1\/2 img { border-radius: 0.75rem; }
    </style>
</head>
<body class="bg-slate-50 text-gray-800 flex flex-col min-h-screen">

    <nav class="site-nav bg-var nav-shadow sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4 w-full">
              <a href="{% url 'articles:article_list' %}" class="flex items-center space-x-3">
                  <i class="fas fa-droplet text-primary text-2xl"></i>
                  <span class="site-logo text-2xl font-black tracking-tighter uppercase">Eco-Tomchi</span>
              </a>

              <div class="hidden lg:flex items-center ml-8 gap-6 nav-links">
                <a href="{% url 'articles:article_list' %}" class="hover:text-accent">BOSH SAHIFA</a>
                <div class="relative group">
                  <button class="hover:text-accent flex items-center uppercase">KATEGORIYALAR <i class="fas fa-chevron-down ml-1 text-[10px]"></i></button>
                  <div class="absolute hidden group-hover:block w-56 bg-var rounded-xl mt-0 py-3 border border-divider shadow-dropdown">
                    {% for cat in categories %}
                      <a href="{% url 'articles:category_detail' cat.id %}" class="block px-5 py-2 hover:bg-spot hover:text-accent transition">{{ cat.name }}</a>
                    {% endfor %}
                  </div>
                </div>
                <a href="{% url 'articles:about' %}" class="hover:text-accent">BIZ HAQIMIZDA</a>
              </div>

              <div class="ml-auto hidden md:flex items-center gap-4">
                <div class="search-wrapper hidden md:flex items-center border border-divider rounded-full overflow-hidden">
                  <input type="search" placeholder="Enter search keywords" class="px-4 py-2 text-sm bg-transparent focus:outline-none text-current placeholder:text-muted" aria-label="Search">
                  <button class="px-3 text-accent"><i class="fas fa-search"></i></button>
                </div>

                <button id="theme-toggle" class="theme-toggle px-3 py-2 rounded-full" aria-label="Toggle theme" title="Toggle light/dark">
                  <i class="fas fa-sun light-icon"></i>
                  <i class="fas fa-moon dark-icon"></i>
                </button>

                <a href="#" class="subscribe-btn hidden lg:inline-flex items-center px-5 py-2 rounded-full font-bold">Subscribe today <i class="fas fa-arrow-right ml-2"></i></a>

                {% if user.is_staff %}
                  <a href="/admin" class="bg-primary text-white px-5 py-2 rounded-full hover:opacity-95 transition"><i class="fas fa-pen-nib mr-1"></i> WRITE</a>
                {% endif %}
              </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer py-12 mt-12">
        <div class="container mx-auto px-6 text-center">
            <p class="text-xl font-bold mb-4 italic">"Har bir tomchida hayot bor"</p>
            <p class="text-sm text-muted">&copy; 2025 Eco-Tomchi. Barcha huquqlar himoyalangan.</p>
        </div>
    </footer>

    <script src="/static/js/theme-toggle.js"></script>
</body>
</html>
